name: Retrieval evaluation

on:
  push:
    branches: [main]
    paths:
      - "eval/queries.json"
      - "eval/evaluate.py"
      - "engine.py"
      - "vibe.py"
      - "catalog_cache.pkl"
      - "vector_cache.npy"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU-only torch)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q sentence-transformers pandas numpy scikit-learn
      - name: Evaluate
        run: python eval/evaluate.py --out eval/results.md
      - name: Publish summary
        run: cat eval/results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/results.md
          git diff --cached --quiet || (git commit -m "eval: update retrieval results [skip ci]" && git push)
